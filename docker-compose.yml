services:
  postgres:
    image: postgres:17-alpine
    container_name: v_o_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-v_o_db}
      POSTGRES_USER: ${POSTGRES_USER:-v_o_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-v_o_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-v_o_user} -d ${POSTGRES_DB:-v_o_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: v_o_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    # CI가 GHCR에 올린 이미지를 사용한다(EC2는 pull만 수행).
    # 로컬에서 소스로 직접 빌드하려면 `docker compose up -d --build`.
    image: ${APP_IMAGE:-ghcr.io/v-o-dev/v_o_server:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v_o_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-v_o_db}
      DB_USER: ${POSTGRES_USER:-v_o_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-v_o_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
    ports:
      - "${APP_PORT:-8080}:8080"
  nginx:
    image: nginx:latest
    container_name: v_o_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # certbot webroot 갱신용 챌린지 파일 경로 (호스트 certbot이 파일을 쓰고 nginx가 서빙)
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
