server {
    listen 80;
    server_name 54.206.52.35.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 54.206.52.35.sslip.io;

    ssl_certificate /etc/letsencrypt/live/54.206.52.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.206.52.35.nip.io/privkey.pem;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}