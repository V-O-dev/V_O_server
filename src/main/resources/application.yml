server:
  # nginx 뒤에 있으므로 X-Forwarded-Proto/Host를 신뢰해야 요청 URL을 https로 올바르게 인식한다.
  # (테스트용 OAuth 콜백이 자기 주소를 redirect_uri로 만들 때 필요)
  forward-headers-strategy: framework

spring:
  application:
    name: V_O_server

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:v_o_db}
    username: ${DB_USER:v_o_user}
    password: ${DB_PASSWORD:v_o_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true

  sql:
    init:
      mode: always

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

cors:
  # 콤마로 구분. 와일드카드(*) 사용 가능 — Vercel 프리뷰 배포는 URL이 매번 바뀐다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://*.vercel.app}

storage:
  type: ${STORAGE_TYPE:local}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    region: ${AWS_REGION:ap-southeast-2}

jwt:
  secret-key: ${JWT_SECRET_KEY:__CHANGE_ME_BASE64_ENCODED_SECRET_AT_LEAST_32_BYTES__}
  access-token-validity-seconds: 3600
  refresh-token-validity-seconds: 1209600

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    authorize-uri: https://accounts.google.com/o/oauth2/v2/auth
    token-uri: https://oauth2.googleapis.com/token
    user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
    revoke-uri: https://oauth2.googleapis.com/revoke
  kakao:
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    admin-key: ${KAKAO_ADMIN_KEY:}
    authorize-uri: https://kauth.kakao.com/oauth/authorize
    token-uri: https://kauth.kakao.com/oauth/token
    user-info-uri: https://kapi.kakao.com/v2/user/me
    unlink-uri: https://kapi.kakao.com/v1/user/unlink
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:}
    authorize-uri: https://nid.naver.com/oauth2.0/authorize
    token-uri: https://nid.naver.com/oauth2.0/token
    user-info-uri: https://openapi.naver.com/v1/nid/me