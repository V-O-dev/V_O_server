server {
    listen 80;
    server_name 54.206.52.35.nip.io;

    # Let's Encrypt webroot 인증 경로.
    # certbot 갱신 시 이 경로로 챌린지 파일을 요청하므로 HTTPS 리다이렉트보다 먼저 처리돼야 한다.
    # nginx는 더 구체적인 prefix location을 우선 매칭하므로 아래 location / 보다 먼저 걸린다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 54.206.52.35.nip.io;

    ssl_certificate /etc/letsencrypt/live/54.206.52.35.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/54.206.52.35.nip.io/privkey.pem;

    # 영상 업로드 대응 (application.yml의 multipart 최대 10MB와 맞춤).
    # 기본값 1M이면 업로드가 nginx 단에서 413으로 잘린다.
    client_max_body_size 10M;

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}