name: CI

# PR 검증용. 빌드와 테스트만 수행하고 배포는 하지 않는다.
on:
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # VOServerApplicationTests(@SpringBootTest)가 전체 컨텍스트를 띄우므로 DB/Redis가 필요하다.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: v_o_db
          POSTGRES_USER: v_o_user
          POSTGRES_PASSWORD: v_o_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build & Test
        run: ./gradlew build --no-daemon
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: v_o_db
          DB_USER: v_o_user
          DB_PASSWORD: v_o_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # 테스트 전용 더미 키 (실제 운영 키와 무관)
          JWT_SECRET_KEY: ci-only-dummy-secret-key-not-used-in-production-at-least-64-bytes-long

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
